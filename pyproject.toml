[project]
name = "opspilot"
version = "0.1.0"
description = "Autonomous production engineering agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "mcp[cli]>=2,<3",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.52.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
