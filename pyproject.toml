[project]
name = "opspilot"
version = "0.1.0"
description = "Autonomous production engineering agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "groq>=1.7.0",
    "langgraph>=1.2.11",
    "mcp[cli]>=2,<3",
    "pydantic>=2.13.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
