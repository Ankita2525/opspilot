# Local Cloud Run topology emulation (no GCP credentials required).
#
# Sidecars share the backend network namespace — same as Cloud Run multi-container.
# Listen on 0.0.0.0 (Cloud Run probe contract); clients still dial 127.0.0.1:*.
#
# Usage:
#   docker compose -f docker-compose.cloud-run-local.yml up --build
#   OPSPILOT_MODEL_PROVIDER=deterministic pytest tests/test_cloud_run_profile.py -q
#   python scripts/validate_cloud_run_local.py

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
    ports:
      - "5432:5432"
    volumes:
      - cloud-run-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/loki/api/v1/status/buildinfo | grep -q version"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OPSPILOT_ENV: production
      OPSPILOT_DEPLOYMENT_PROFILE: ephemeral_live_lab
      OPSPILOT_MODEL_PROVIDER: ${OPSPILOT_MODEL_PROVIDER:-deterministic}
      OPSPILOT_TELEMETRY_MODE: live
      OPSPILOT_PROMETHEUS_URL: http://127.0.0.1:9090
      OPSPILOT_LOKI_URL: http://loki:3100
      SANDBOX_CONTROL_TOKEN: ${SANDBOX_CONTROL_TOKEN:-sandbox-control-test-token}
      CHECKOUT_API_URL: http://127.0.0.1:8081
      AUTH_SERVICE_URL: http://127.0.0.1:8082
      PAYMENTS_SERVICE_URL: http://127.0.0.1:8083
      PROVIDER_SERVICE_URL: http://127.0.0.1:8084
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DATABASE_URL: postgresql://opspilot:opspilot@postgres:5432/opspilot
      OPSPILOT_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    network_mode: service:backend
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      backend:
        condition: service_started

  checkout-api:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    network_mode: service:backend
    command: ["uvicorn", "sandbox.checkout.app:app", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      SANDBOX_SERVICE_NAME: checkout-api
      CHECKOUT_DATABASE_URL: postgresql://opspilot:opspilot@postgres:5432/opspilot
      SANDBOX_CONTROL_TOKEN: ${SANDBOX_CONTROL_TOKEN:-sandbox-control-test-token}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    depends_on:
      backend:
        condition: service_started
      otel-collector:
        condition: service_started

  auth-service:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    network_mode: service:backend
    command: ["uvicorn", "sandbox.auth.app:app", "--host", "0.0.0.0", "--port", "8082"]
    environment:
      SANDBOX_SERVICE_NAME: auth-service
      SANDBOX_CONTROL_TOKEN: ${SANDBOX_CONTROL_TOKEN:-sandbox-control-test-token}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    depends_on:
      backend:
        condition: service_started

  provider-service:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    network_mode: service:backend
    command: ["uvicorn", "sandbox.provider.app:app", "--host", "0.0.0.0", "--port", "8084"]
    environment:
      SANDBOX_SERVICE_NAME: provider-service
      SANDBOX_CONTROL_TOKEN: ${SANDBOX_CONTROL_TOKEN:-sandbox-control-test-token}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    depends_on:
      backend:
        condition: service_started

  payments-service:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    network_mode: service:backend
    command: ["uvicorn", "sandbox.payments.app:app", "--host", "0.0.0.0", "--port", "8083"]
    environment:
      SANDBOX_SERVICE_NAME: payments-service
      PROVIDER_SERVICE_URL: http://127.0.0.1:8084
      SANDBOX_CONTROL_TOKEN: ${SANDBOX_CONTROL_TOKEN:-sandbox-control-test-token}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    depends_on:
      provider-service:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.2.1
    network_mode: service:backend
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/tmp/prometheus
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./deploy/cloud-run/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      checkout-api:
        condition: service_started
      auth-service:
        condition: service_started
      payments-service:
        condition: service_started

volumes:
  cloud-run-postgres:
