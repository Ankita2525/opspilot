# OTEL collector for Cloud Run multi-container.
# Receivers bind 0.0.0.0 so Cloud Run TCP startup probes can succeed.
# In-instance OTLP clients still dial the shared loopback port.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  loki:
    endpoint: ${GRAFANA_CLOUD_LOKI_ENDPOINT}
    headers:
      Authorization: ${OPSPILOT_LOKI_AUTHORIZATION}

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki]
