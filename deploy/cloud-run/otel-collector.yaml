# OTEL collector for Cloud Run multi-container (localhost sandbox exporters).
# Loaded via --config=env:OTEL_COLLECTOR_CONFIG at runtime.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:

exporters:
  loki:
    endpoint: ${GRAFANA_CLOUD_LOKI_ENDPOINT}
    headers:
      Authorization: ${OPSPILOT_LOKI_AUTHORIZATION}

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki]
