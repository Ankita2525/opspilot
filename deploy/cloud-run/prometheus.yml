# Prometheus scrape config for Cloud Run multi-container (localhost sidecars).
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: checkout-api
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8081"]
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8082"]
  - job_name: payments-service
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8083"]
  - job_name: provider-service
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8084"]
