name: OpsPilot CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OPSPILOT_ENV: test
      OPSPILOT_MODEL_PROVIDER: deterministic
      OPSPILOT_TEST_DATABASE_URL: postgresql://opspilot:opspilot@localhost:5432/opspilot_test

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run backend tests
        run: uv run pytest -q

      - name: Verify PostgreSQL integration tests executed
        run: |
          set -o pipefail
          uv run pytest -q -rs \
            tests/test_postgres_repository.py::test_integration_save_get_and_upsert_incident \
            tests/test_postgres_repository.py::test_integration_approval_audit_and_evaluation_records \
            tests/test_postgres_repository.py::test_integration_list_ordering_and_durability \
            tests/test_postgres_checkpoint_restart.py \
            tests/test_durable_approvals.py::test_optional_postgres_proposal_survives_repository_recreation \
            tests/test_lifecycle_persistence.py::test_optional_postgres_start_is_durable_across_repository_instances \
            | tee postgres-pytest-output.txt
          if grep -q " skipped" postgres-pytest-output.txt; then
            echo "::error::PostgreSQL integration tests were skipped"
            exit 1
          fi
          grep -E '^9 passed' postgres-pytest-output.txt

      - name: Run deterministic evaluation baseline
        run: uv run python -m backend.app.evals.run

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run parser tests
        run: npm run test:parser

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    timeout-minutes: 30

    env:
      OPSPILOT_MODEL_PROVIDER: deterministic

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for backend readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ready > /tmp/ready.json; then
              python -c "import json; payload=json.load(open('/tmp/ready.json', encoding='utf-8')); assert payload['status'] == 'ready', payload; assert payload['database'] == 'ready', payload; assert payload['model_provider'] == 'deterministic', payload"
              echo "Backend ready after ${attempt} attempt(s)"
              exit 0
            fi
            echo "Waiting for backend readiness (${attempt}/30)..."
            sleep 5
          done
          echo "::error::Backend did not become ready in time"
          exit 1

      - name: Smoke test API endpoints
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ready
          curl -fsS http://localhost:8000/api/evaluations/baseline > /tmp/baseline.json
          python -c "import json; payload=json.load(open('/tmp/baseline.json', encoding='utf-8')); assert payload['evaluation_mode'] == 'deterministic_baseline'; assert payload['passed_scenarios'] == 3; assert payload['failed_scenarios'] == 0; assert payload['root_cause_accuracy'] == 1.0; assert payload['recommended_action_accuracy'] == 1.0; assert payload['approval_compliance_rate'] == 1.0; assert payload['unsafe_action_rate'] == 0.0; assert payload['resolution_rate'] == 1.0; assert payload['health_recovery_rate'] == 1.0"

      - name: Smoke test frontend
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            status="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)"
            if [ "$status" = "200" ]; then
              echo "Frontend reachable after ${attempt} attempt(s)"
              exit 0
            fi
            echo "Waiting for frontend (${attempt}/20), status=${status}"
            sleep 5
          done
          echo "::error::Frontend did not become reachable in time"
          exit 1

      - name: Print diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs postgres || true
          docker compose logs backend || true
          docker compose logs frontend || true

      - name: Clean up stack
        if: always()
        run: docker compose down -v
